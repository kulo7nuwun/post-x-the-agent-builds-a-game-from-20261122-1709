<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Fruit Catcher — built from one prompt</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #12081f; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; font-family: system-ui, sans-serif; }
  #wrap { position: relative; width: min(100vw, 56.25vh); height: min(100vh, 177.78vw); }
  canvas { display: block; width: 100%; height: 100%; border-radius: 18px;
           box-shadow: 0 0 60px rgba(196, 28, 131, .45); touch-action: none; }
  #hint { position: absolute; left: 0; right: 0; bottom: 10px; text-align: center;
          color: #ffffff88; font-size: 12px; pointer-events: none; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="540" height="960"></canvas>
  <div id="hint">← → or drag to move &nbsp;•&nbsp; catch fruit, don't drop 3</div>
</div>
<script>
"use strict";
// Fruit Catcher — built from ONE prompt:
// "Build a tiny browser game where you slide a basket left and right to catch
//  falling fruit, score a point per catch, and lose a life per miss — three
//  misses ends the game."
const cv = document.getElementById("game");
const ctx = cv.getContext("2d");
const W = 540, H = 960;
const AUTO = new URLSearchParams(location.search).has("auto");

const FRUITS = [
  { name: "apple",  color: "#ff4757", dark: "#c0392b", r: 26, pts: 1 },
  { name: "orange", color: "#ffa502", dark: "#e67e22", r: 24, pts: 1 },
  { name: "lemon",  color: "#f1c40f", dark: "#d4ac0d", r: 22, pts: 1 },
  { name: "plum",   color: "#a55eea", dark: "#8854d0", r: 23, pts: 2 },
  { name: "berry",  color: "#ff6b9d", dark: "#e84393", r: 18, pts: 2 },
];

const state = {
  mode: "title",      // title | playing | over
  score: 0, lives: 3, timeLeft: 60,
  basketX: W / 2, basketW: 130, basketH: 34, basketY: H - 90,
  fruits: [], parts: [], spawnIn: 0, elapsed: 0, last: 0,
  keys: {}, pointerX: null, flash: 0, caught: 0, missed: 0,
};

function reset() {
  state.score = 0; state.lives = 3; state.timeLeft = 60;
  state.fruits = []; state.parts = []; state.elapsed = 0;
  state.basketX = W / 2; state.caught = 0; state.missed = 0;
  state.mode = "playing";
}

function spawnFruit() {
  const f = FRUITS[(Math.random() * FRUITS.length) | 0];
  const x = 30 + Math.random() * (W - 60);
  const speed = 150 + Math.random() * 90 + state.elapsed * 2.2;
  state.fruits.push({ x, y: -40, vy: speed, vx: (Math.random() - 0.5) * 40,
                      kind: f, rot: Math.random() * Math.PI * 2, vr: (Math.random() - 0.5) * 2 });
}

function burst(x, y, color, n) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, s = 60 + Math.random() * 160;
    state.parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 60,
                       life: 0.6 + Math.random() * 0.3, color, r: 3 + Math.random() * 4 });
  }
}

function update(dt) {
  state.elapsed += dt;
  state.timeLeft = Math.max(0, 60 - state.elapsed);
  if (state.timeLeft <= 0) { state.mode = "over"; return; }

  // Basket movement: keys, pointer drag, or autopilot (for the demo video).
  const speed = 520;
  if (AUTO) {
    let target = null, bestY = -1;
    for (const f of state.fruits) if (f.y > bestY) { bestY = f.y; target = f.x; }
    if (target !== null) {
      const d = target - state.basketX;
      state.basketX += Math.max(-speed * dt, Math.min(speed * dt, d));
    }
  } else if (state.pointerX !== null) {
    state.basketX += (state.pointerX - state.basketX) * Math.min(1, dt * 14);
  } else {
    if (state.keys.ArrowLeft || state.keys.a) state.basketX -= speed * dt;
    if (state.keys.ArrowRight || state.keys.d) state.basketX += speed * dt;
  }
  state.basketX = Math.max(state.basketW / 2, Math.min(W - state.basketW / 2, state.basketX));

  // Spawn fruit, faster as time goes on.
  state.spawnIn -= dt;
  if (state.spawnIn <= 0) {
    spawnFruit();
    state.spawnIn = Math.max(0.32, 0.75 - state.elapsed * 0.006);
  }

  // Move fruit; catch or miss.
  const top = state.basketY, bottom = state.basketY + state.basketH;
  for (let i = state.fruits.length - 1; i >= 0; i--) {
    const f = state.fruits[i];
    f.y += f.vy * dt; f.x += f.vx * dt; f.rot += f.vr * dt;
    if (f.x < f.kind.r) { f.x = f.kind.r; f.vx = Math.abs(f.vx); }
    if (f.x > W - f.kind.r) { f.x = W - f.kind.r; f.vx = -Math.abs(f.vx); }
    const inBasket = f.y + f.kind.r >= top && f.y <= bottom + 14 &&
      Math.abs(f.x - state.basketX) < state.basketW / 2 + 6;
    if (inBasket) {
      state.score += f.kind.pts; state.caught++;
      burst(f.x, top, f.kind.color, 12);
      state.fruits.splice(i, 1);
    } else if (f.y - f.kind.r > H) {
      state.lives--; state.missed++; state.flash = 0.35;
      burst(f.x, H - 30, "#ffffff", 8);
      state.fruits.splice(i, 1);
      if (state.lives <= 0) state.mode = "over";
    }
  }

  for (let i = state.parts.length - 1; i >= 0; i--) {
    const p = state.parts[i];
    p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 420 * dt; p.life -= dt;
    if (p.life <= 0) state.parts.splice(i, 1);
  }
  if (state.flash > 0) state.flash -= dt;
}

function drawFruit(f) {
  ctx.save();
  ctx.translate(f.x, f.y); ctx.rotate(f.rot);
  const r = f.kind.r;
  ctx.fillStyle = f.kind.color;
  ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = f.kind.dark;
  ctx.beginPath(); ctx.arc(-r * 0.3, -r * 0.3, r * 0.45, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = "#2ed573"; ctx.lineWidth = 4; ctx.lineCap = "round";
  ctx.beginPath(); ctx.moveTo(0, -r); ctx.quadraticCurveTo(r * 0.3, -r - 12, r * 0.55, -r - 8); ctx.stroke();
  ctx.fillStyle = "#ffffff55";
  ctx.beginPath(); ctx.arc(-r * 0.35, -r * 0.4, r * 0.28, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}

function drawBasket() {
  const x = state.basketX - state.basketW / 2, y = state.basketY;
  ctx.fillStyle = "#c41c83";
  ctx.beginPath();
  ctx.moveTo(x, y); ctx.lineTo(x + state.basketW, y);
  ctx.lineTo(x + state.basketW - 12, y + state.basketH);
  ctx.lineTo(x + 12, y + state.basketH); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = "#ff7ac0"; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.moveTo(x + 8, y + 12); ctx.lineTo(x + state.basketW - 8, y + 12); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x + 14, y + 24); ctx.lineTo(x + state.basketW - 14, y + 24); ctx.stroke();
}

function drawHUD() {
  ctx.fillStyle = "#ffffff"; ctx.textAlign = "left"; ctx.textBaseline = "top";
  ctx.font = "bold 34px system-ui, sans-serif";
  ctx.fillText("SCORE  " + state.score, 24, 22);
  ctx.font = "bold 26px system-ui, sans-serif";
  ctx.fillStyle = "#ffd32a";
  ctx.fillText("⏱ " + Math.ceil(state.timeLeft) + "s", 24, 66);
  ctx.fillStyle = "#ff4757"; ctx.textAlign = "right";
  ctx.fillText("♥".repeat(state.lives) + "♡".repeat(Math.max(0, 3 - state.lives)), W - 24, 66);
  ctx.textAlign = "left";
}

function drawTitle() {
  ctx.fillStyle = "#ffffff"; ctx.textAlign = "center";
  ctx.font = "bold 64px system-ui, sans-serif";
  ctx.fillText("FRUIT", W / 2, 300);
  ctx.fillStyle = "#ff7ac0";
  ctx.fillText("CATCHER", W / 2, 372);
  ctx.fillStyle = "#ffffffcc"; ctx.font = "28px system-ui, sans-serif";
  ctx.fillText("Catch the fruit. Don't drop 3.", W / 2, 480);
  ctx.fillStyle = "#ffd32a"; ctx.font = "bold 30px system-ui, sans-serif";
  ctx.fillText(AUTO ? "▶ DEMO — autopilot on" : "▶ TAP OR PRESS SPACE TO PLAY", W / 2, 560);
  ctx.textAlign = "left";
}

function drawOver() {
  ctx.fillStyle = "#000000aa"; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = "#ffffff"; ctx.textAlign = "center";
  ctx.font = "bold 56px system-ui, sans-serif";
  ctx.fillText(state.lives <= 0 ? "GAME OVER" : "TIME UP!", W / 2, 360);
  ctx.fillStyle = "#ffd32a"; ctx.font = "bold 44px system-ui, sans-serif";
  ctx.fillText("Score: " + state.score, W / 2, 450);
  ctx.fillStyle = "#ffffffcc"; ctx.font = "26px system-ui, sans-serif";
  ctx.fillText(state.caught + " caught • " + state.missed + " missed", W / 2, 520);
  ctx.fillStyle = "#ff7ac0"; ctx.font = "bold 28px system-ui, sans-serif";
  ctx.fillText("Press R to play again", W / 2, 600);
  ctx.textAlign = "left";
}

function draw() {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, "#1b0b2e"); g.addColorStop(1, "#12081f");
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = "#ffffff08";
  for (let i = 0; i < 6; i++) ctx.fillRect(0, 140 + i * 150, W, 2);
  if (state.mode === "title") { drawTitle(); return; }
  for (const f of state.fruits) drawFruit(f);
  drawBasket();
  for (const p of state.parts) {
    ctx.globalAlpha = Math.max(0, p.life * 1.6);
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;
  drawHUD();
  if (state.flash > 0) { ctx.fillStyle = `rgba(255,71,87,${state.flash})`; ctx.fillRect(0, 0, W, H); }
  if (state.mode === "over") drawOver();
}

function frame(t) {
  const now = t / 1000;
  const dt = Math.min(0.05, state.last ? now - state.last : 0.016);
  state.last = now;
  if (state.mode === "playing") update(dt);
  draw();
  requestAnimationFrame(frame);
}

addEventListener("keydown", (e) => {
  state.keys[e.key] = true;
  if (e.key === " " && state.mode === "title") reset();
  if ((e.key === "r" || e.key === "R") && state.mode === "over") reset();
  if (e.key.startsWith("Arrow")) e.preventDefault();
});
addEventListener("keyup", (e) => { state.keys[e.key] = false; });
cv.addEventListener("pointerdown", (e) => {
  const r = cv.getBoundingClientRect();
  state.pointerX = (e.clientX - r.left) / r.width * W;
  if (state.mode === "title") reset();
});
cv.addEventListener("pointermove", (e) => {
  if (state.pointerX === null) return;
  const r = cv.getBoundingClientRect();
  state.pointerX = (e.clientX - r.left) / r.width * W;
});
addEventListener("pointerup", () => { state.pointerX = null; });

if (AUTO) reset();
requestAnimationFrame(frame);
</script>
</body>
</html>
